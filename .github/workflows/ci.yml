name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to the same branch makes the running one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every target with both back ends: build lcc, then src/run-llvm.sh's
  # suites, the unit tests also with gcc's drivers, optimized drivers and
  # optimized lcc code, and src/selfhost.sh where lcc can run on the target.
  # The external suites are fetched at fixed commits, not kept here.
  target:
    name: ${{ matrix.backend }}/${{ matrix.target }}
    needs: riscv32-toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-linux, aarch64-linux, riscv64-linux, armhf-linux, riscv32-linux, cortexm3-eabi]
        backend: [llvm, mlir]
    env:
      T: ${{ matrix.target }}
      BE: ${{ matrix.backend }}
      B: ${{ github.workspace }}/../build
      SUITES: ${{ github.workspace }}/../suites
      RISCV32: /home/runner/riscv32
    steps:
      - uses: actions/checkout@v5

      - name: Install the tools
        run: .github/scripts/ci-target.sh deps "$T" "$BE"

      - name: Restore the riscv32 toolchain
        if: matrix.target == 'riscv32-linux'
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/riscv32
          key: riscv32-toolchain-${{ hashFiles('.github/scripts/riscv32-toolchain.sh') }}
          fail-on-cache-miss: true

      - name: Cache the external suites
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../suites
          key: suites-${{ hashFiles('.github/scripts/fetch-suites.sh') }}

      - name: Fetch the external suites
        run: .github/scripts/fetch-suites.sh "$SUITES"

      - name: Build
        run: .github/scripts/ci-target.sh build "$T" "$BE" "$B"

      - name: lcc
        if: success() || failure()
        run: src/run-llvm.sh -q -t "$T" -b "$B" lcc

      - name: unit
        if: success() || failure()
        run: src/run-llvm.sh -q -t "$T" -b "$B" unit

      - name: unit, drivers by gcc
        if: success() || failure()
        run: DRVCC=gcc src/run-llvm.sh -q -t "$T" -b "$B" -o "$B/unit-gcc" unit

      - name: unit, optimized drivers
        if: success() || failure()
        run: DRVOPT=-O2 src/run-llvm.sh -q -t "$T" -b "$B" -o "$B/unit-drvopt" unit

      - name: unit, optimized lcc code
        if: success() || failure()
        run: LCCFLAGS=-Wa-O2 src/run-llvm.sh -q -t "$T" -b "$B" -o "$B/unit-wa" unit

      - name: c-testsuite
        if: success() || failure()
        run: src/run-llvm.sh -q -t "$T" -b "$B" c-testsuite "$SUITES/c-testsuite"

      - name: torture
        if: success() || failure()
        run: src/run-llvm.sh -q -t "$T" -b "$B" torture "$SUITES/llvm-test-suite/SingleSource/Regression/C/gcc-c-torture/execute"

      - name: llvm-bench
        if: success() || failure()
        run: src/run-llvm.sh -q -t "$T" -b "$B" llvm-bench "$SUITES/llvm-test-suite"

      # lcc cannot run on the bare Cortex-M3 board; the cross stages of the
      # others run under qemu through binfmt_misc.
      - name: selfhost
        if: (success() || failure()) && matrix.target != 'cortexm3-eabi'
        run: src/selfhost.sh -t "$BE" -x "$T" -b "$B"

  # x86-64 only: the original x86/linux back end, the two back ends against
  # each other, and the MLIR lint's own tests.
  host:
    name: x86_64 extras
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BL: ${{ github.workspace }}/../build-llvm
      BM: ${{ github.workspace }}/../build-mlir
    steps:
      - uses: actions/checkout@v5

      - name: Install the tools
        run: .github/scripts/ci-target.sh deps x86_64-linux mlir

      - name: Build both back ends
        run: |
          .github/scripts/ci-target.sh build x86_64-linux llvm "$BL"
          .github/scripts/ci-target.sh build x86_64-linux mlir "$BM"

      - name: Original x86/linux back end
        if: success() || failure()
        run: src/run-x86.sh -q -b "$BL"

      - name: llvm and mlir back ends compared
        if: success() || failure()
        run: src/cmp-backends.sh -l "$BL" -m "$BM" tst

      - name: MLIR lint's tests
        if: success() || failure()
        run: src/mlir-lint.sh -t

  # Ubuntu does not package a riscv32 glibc toolchain. Building one takes an
  # hour, so it is cached, keyed on the script that pins its commit; the
  # other jobs wait for it only on the first run.
  riscv32-toolchain:
    name: riscv32 toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Look for it in the cache
        id: cache
        uses: actions/cache@v4
        with:
          path: /home/runner/riscv32
          key: riscv32-toolchain-${{ hashFiles('.github/scripts/riscv32-toolchain.sh') }}

      # gcc's and glibc's sources and build need more than the runner has
      # free; drop what this job does not use.
      - name: Make room
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build it
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            autoconf automake autotools-dev curl python3 python3-tomli \
            libmpc-dev libmpfr-dev libgmp-dev gawk build-essential bison flex \
            texinfo gperf libtool patchutils bc zlib1g-dev libexpat-dev \
            ninja-build git cmake libglib2.0-dev libslirp-dev
          .github/scripts/riscv32-toolchain.sh /home/runner/riscv32

  # Parses meta-lcc against openembedded-core instead of building it, which
  # takes hours: meta-lcc/scripts/check-tests.sh is the real build.
  yocto-layer:
    name: Yocto layer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install BitBake's host requirements
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            gawk diffstat chrpath cpio zstd lz4 file locales rpcsvc-proto
          sudo sed -i 's/^# *en_US.UTF-8 UTF-8/en_US.UTF-8 UTF-8/' /etc/locale.gen
          sudo locale-gen

      # oe-core checks that a child can unshare and get its uid back;
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
      - name: Let BitBake use user namespaces
        run: |
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user true

      - name: Parse the layer and check what it resolves to
        env:
          LANG: en_US.UTF-8
        run: .github/scripts/yocto-layer-check.sh "$GITHUB_WORKSPACE/meta-lcc" "$RUNNER_TEMP/oe"
